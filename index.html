<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>윤슬의 한글게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(135deg, #FFF9E6 0%, #E8F5E9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    #game-container {
      width: 100%;
      max-width: 600px;
      background: #FFFFFF;
      border-radius: 36px;
      padding: 24px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08), 0 0 0 10px #FFF3D6;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 520px;
      justify-content: space-between;
    }

    /* 상단 헤더 */
    .header {
      margin-bottom: 12px;
    }

    .title {
      font-size: 2.2rem;
      color: #FF6B6B;
      text-shadow: 2px 2px 0px #FFE066;
      letter-spacing: 1px;
    }

    .sub-title {
      font-size: 1.1rem;
      color: #4D96FF;
      margin-top: 4px;
    }

    /* 퀴즈 영역 */
    .quiz-card {
      background: #F8F9FA;
      border: 4px dashed #FFD166;
      border-radius: 28px;
      padding: 20px 10px;
      margin: 14px 0;
      transition: all 0.3s ease;
    }

    .avatar-icon {
      font-size: 4.8rem;
      display: inline-block;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.1));
      animation: float 2.4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    .prompt-label {
      font-size: 1.25rem;
      color: #6C757D;
      margin-top: 6px;
    }

    .target-word {
      font-size: 2.6rem;
      color: #333333;
      margin-top: 4px;
      font-weight: bold;
    }

    /* 보기 버튼 목록 */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .option-btn {
      background: #FFFFFF;
      border: 4px solid #6BCB77;
      border-radius: 24px;
      padding: 16px 8px;
      font-family: 'Jua', sans-serif;
      font-size: 2rem;
      color: #2D3748;
      cursor: pointer;
      box-shadow: 0 6px 0 #4EA85A;
      transition: transform 0.1s, box-shadow 0.1s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover {
      background: #F0FFF4;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4EA85A;
    }

    /* 모드 전환 탭 버튼 */
    .mode-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .mode-tab {
      background: #EDF2F7;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      color: #718096;
      cursor: pointer;
    }

    .mode-tab.active {
      background: #FF6B6B;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
    }

    /* 다시 듣기 버튼 */
    .tts-btn {
      background: #FFD166;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      color: #5D4037;
      cursor: pointer;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0 #E5B339;
    }

    .tts-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #E5B339;
    }

    /* 별점 / 진행도 */
    .score-container {
      margin-top: 10px;
      font-size: 1.3rem;
      color: #FFB703;
    }

    /* 축하 효과 애니메이션 오버레이 */
    .celebration-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration-emoji {
      font-size: 5rem;
      animation: heartBeat 0.7s infinite alternate;
    }

    @keyframes heartBeat {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    .celebration-text {
      font-size: 2.2rem;
      color: #FF4D6D;
      margin-top: 12px;
    }

    .correct-flash {
      animation: flashSuccess 0.5s ease;
    }

    .wrong-flash {
      animation: shakeFail 0.4s ease;
    }

    @keyframes flashSuccess {
      0% { background: #C6F6D5; }
      100% { background: #FFFFFF; }
    }

    @keyframes shakeFail {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 헤더 -->
    <div class="header">
      <h1 class="title">✨ 윤슬의 한글게임 ✨</h1>
      <div class="sub-title">우리가족 이름을 맞춰봐요!</div>
    </div>

    <!-- 모드 선택 탭 -->
    <div class="mode-switch">
      <button class="mode-tab active" id="tab-mode-name" onclick="changeMode('familyToName')">호칭 ➔ 이름 맞추기</button>
      <button class="mode-tab" id="tab-mode-family" onclick="changeMode('nameToFamily')">이름 ➔ 호칭 맞추기</button>
      <button class="mode-tab" id="tab-mode-word" onclick="changeMode('wordMatch')">같은 글자 짝꿍</button>
    </div>

    <!-- 문제 카드 -->
    <div class="quiz-card" id="quizCard">
      <div class="avatar-icon" id="questionIcon">👩</div>
      <div class="prompt-label" id="questionPrompt">엄마의 이름은 무엇일까요?</div>
      <div class="target-word" id="questionWord">엄마</div>
      <br>
      <button class="tts-btn" onclick="speakCurrentQuestion()">🔊 목소리로 듣기</button>
    </div>

    <!-- 보기 버튼 (4개 or 3개) -->
    <div class="options-grid" id="optionsGrid">
      <!-- 동적 생성 -->
    </div>

    <!-- 점수 / 진행 -->
    <div class="score-container" id="starDisplay">
      ⭐ 별 모으기: 0개
    </div>

    <!-- 정답 오버레이 -->
    <div class="celebration-overlay" id="celebrationOverlay">
      <div class="celebration-emoji" id="celebrationEmoji">🎉</div>
      <div class="celebration-text" id="celebrationText">참 잘했어요!</div>
    </div>
  </div>

  <script>
    // 가족 데이터 (윤슬이는 5살 남아 캐릭터 👦🏻/🧒)
    const familyData = [
      { role: '엄마', name: '남호정', icon: '👩' },
      { role: '아빠', name: '윤태환', icon: '👨' },
      { role: '형아', name: '윤호',   icon: '👦' },
      { role: '윤슬', name: '윤슬',   icon: '🧒' }
    ];

    let currentMode = 'familyToName'; // 'familyToName' | 'nameToFamily' | 'wordMatch'
    let currentQuestion = null;
    let starsCount = 0;
    let isProcessing = false;

    // Web Audio API 효과음
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (type === 'correct') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          g.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.25);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(audioCtx.currentTime + idx * 0.1);
          o.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
        });
      } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    // TTS 목소리 말하기
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.85; // 5세 아이 눈높이에 맞춰 천천히 또박또박
        utterance.pitch = 1.2;
        window.speechSynthesis.speak(utterance);
      }
    }

    function changeMode(mode) {
      currentMode = mode;
      document.getElementById('tab-mode-name').classList.toggle('active', mode === 'familyToName');
      document.getElementById('tab-mode-family').classList.toggle('active', mode === 'nameToFamily');
      document.getElementById('tab-mode-word').classList.toggle('active', mode === 'wordMatch');
      nextRound();
    }

    function nextRound() {
      isProcessing = false;
      document.getElementById('celebrationOverlay').style.display = 'none';

      const targetItem = familyData[Math.floor(Math.random() * familyData.length)];
      currentQuestion = {
        target: targetItem,
        mode: currentMode
      };

      const iconEl = document.getElementById('questionIcon');
      const promptEl = document.getElementById('questionPrompt');
      const wordEl = document.getElementById('questionWord');
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';

      iconEl.innerText = targetItem.icon;

      let answerText = '';
      let promptVoice = '';

      if (currentMode === 'familyToName') {
        promptEl.innerText = `${targetItem.role}의 이름은 무엇일까요?`;
        wordEl.innerText = targetItem.role;
        answerText = targetItem.name;
        promptVoice = `${targetItem.role}! ${targetItem.role}의 이름은 무엇일까요?`;
      } else if (currentMode === 'nameToFamily') {
        promptEl.innerText = `${targetItem.name}은(는) 누구일까요?`;
        wordEl.innerText = targetItem.name;
        answerText = targetItem.role;
        promptVoice = `${targetItem.name}! 누구일까요?`;
      } else if (currentMode === 'wordMatch') {
        promptEl.innerText = `똑같은 글자를 찾아보세요!`;
        wordEl.innerText = targetItem.name;
        answerText = targetItem.name;
        promptVoice = `${targetItem.name}! 똑같은 글자를 찾아보세요!`;
      }

      currentQuestion.correctAnswer = answerText;
      currentQuestion.voiceText = promptVoice;

      let candidatePool = [];
      if (currentMode === 'familyToName' || currentMode === 'wordMatch') {
        candidatePool = familyData.map(d => d.name);
      } else {
        candidatePool = familyData.map(d => d.role);
      }

      const incorrectChoices = candidatePool.filter(c => c !== answerText);
      shuffleArray(incorrectChoices);
      const options = [answerText, incorrectChoices[0], incorrectChoices[1]];
      if (incorrectChoices[2]) {
        options.push(incorrectChoices[2]);
      }
      shuffleArray(options);

      options.forEach(optText => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.onclick = () => handleChoice(optText, btn);
        optionsGrid.appendChild(btn);
      });

      speakText(promptVoice);
    }

    function speakCurrentQuestion() {
      if (currentQuestion && currentQuestion.voiceText) {
        speakText(currentQuestion.voiceText);
      }
    }

    function handleChoice(selectedText, btnEl) {
      if (isProcessing) return;

      if (selectedText === currentQuestion.correctAnswer) {
        // 정답
        isProcessing = true;
        playSound('correct');
        starsCount++;
        updateStars();

        btnEl.style.background = '#C6F6D5';
        btnEl.style.borderColor = '#38A169';

        const praises = [
          '정답이에요! 참 잘했어요!',
          '우와! 우리 윤슬이 최고!',
          '맞았어요! 멋쟁이 윤슬이!',
          '딩동댕! 아주 잘했어요!'
        ];
        const celebrationVoice = praises[Math.floor(Math.random() * praises.length)];
        const emojis = ['🌟', '💖', '🎉', '👏', '🥳', '🎈'];
        const chosenEmoji = emojis[Math.floor(Math.random() * emojis.length)];

        document.getElementById('celebrationEmoji').innerText = chosenEmoji;
        document.getElementById('celebrationText').innerText = celebrationVoice;
        document.getElementById('celebrationOverlay').style.display = 'flex';

        speakText(`${selectedText}! ${celebrationVoice}`);

        setTimeout(() => {
          nextRound();
        }, 1800);
      } else {
        // 오답
        playSound('wrong');
        btnEl.classList.add('wrong-flash');
        btnEl.style.background = '#FED7D7';
        btnEl.style.borderColor = '#E53E3E';

        speakText(`괜찮아요, 다시 한번 찾아볼까요?`);

        setTimeout(() => {
          btnEl.classList.remove('wrong-flash');
          btnEl.style.background = '#FFFFFF';
          btnEl.style.borderColor = '#6BCB77';
        }, 600);
      }
    }

    function updateStars() {
      let starStr = `⭐ 별 모으기: ${starsCount}개 (`;
      const displayStars = Math.min(starsCount, 8);
      for (let i = 0; i < displayStars; i++) {
        starStr += '⭐';
      }
      starStr += ')';
      document.getElementById('starDisplay').innerText = starStr;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    window.addEventListener('load', () => {
      nextRound();
    });
  </script>
</body>
</html>
