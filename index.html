<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>윤슬의 한글게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(135deg, #FFF9E6 0%, #E8F5E9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    #game-container {
      width: 100%;
      max-width: 640px;
      background: #FFFFFF;
      border-radius: 36px;
      padding: 22px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08), 0 0 0 10px #FFF3D6;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 560px;
      justify-content: space-between;
    }

    /* 상단 헤더 */
    .title {
      font-size: 2.2rem;
      color: #FF6B6B;
      text-shadow: 2px 2px 0px #FFE066;
      letter-spacing: 1px;
    }

    .sub-title {
      font-size: 1.1rem;
      color: #4D96FF;
      margin-top: 4px;
    }

    /* 최상단 대메뉴: 게임 1 vs 게임 2 선택 버튼 */
    .main-game-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 8px 0;
    }

    .nav-btn {
      flex: 1;
      max-width: 250px;
      background: #EDF2F7;
      border: 3px solid #CBD5E0;
      padding: 12px 10px;
      border-radius: 22px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #4A5568;
      cursor: pointer;
      box-shadow: 0 4px 0 #CBD5E0;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background: #FF6B6B;
      border-color: #E53E3E;
      color: #FFFFFF;
      box-shadow: 0 5px 0 #C53030;
      transform: translateY(-2px);
    }

    /* =================== 게임 1: 콕콕 선택 퀴즈 =================== */
    .game1-submodes {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 6px 0 12px 0;
    }

    .submode-btn {
      background: #F7FAFC;
      border: 2px solid #E2E8F0;
      padding: 6px 12px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      color: #718096;
      cursor: pointer;
    }

    .submode-btn.active {
      background: #4D96FF;
      border-color: #3182CE;
      color: white;
    }

    .quiz-card {
      background: #F8F9FA;
      border: 4px dashed #FFD166;
      border-radius: 28px;
      padding: 18px 12px;
      margin-bottom: 12px;
    }

    .avatar-icon {
      font-size: 4.6rem;
      display: inline-block;
      animation: float 2.4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .prompt-label {
      font-size: 1.3rem;
      color: #4A5568;
      margin-top: 6px;
    }

    .target-word {
      font-size: 2.5rem;
      color: #2D3748;
      margin-top: 4px;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .option-btn {
      background: #FFFFFF;
      border: 4px solid #6BCB77;
      border-radius: 22px;
      padding: 14px 6px;
      font-family: 'Jua', sans-serif;
      font-size: 2rem;
      color: #2D3748;
      cursor: pointer;
      box-shadow: 0 5px 0 #4EA85A;
      transition: transform 0.1s;
      outline: none;
    }

    .option-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #4EA85A;
    }

    /* =================== 게임 2: 한 글자씩 끌어서 완성 =================== */
    .game2-card {
      background: #FFF9ED;
      border: 4px dashed #FFB703;
      border-radius: 28px;
      padding: 16px 12px;
      margin-bottom: 12px;
    }

    /* 완성 슬롯 (남 [ ] [ ]) */
    .slots-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0 10px 0;
    }

    .slot-box {
      width: 72px;
      height: 72px;
      border: 3.5px dashed #CBD5E0;
      border-radius: 20px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      color: #A0AEC0;
      transition: all 0.2s;
    }

    .slot-box.filled {
      border: 3.5px solid #48BB78;
      background: #F0FFF4;
      color: #22543D;
      animation: popSlot 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .slot-box.drag-over {
      background: #FEFCBF;
      border-color: #D69E2E;
      transform: scale(1.08);
    }

    @keyframes popSlot {
      0% { transform: scale(0.6); }
      100% { transform: scale(1); }
    }

    /* 섞인 글자 블록 바구니 */
    .letters-basket {
      background: #F7FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 24px;
      padding: 14px 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      min-height: 85px;
      margin-top: 8px;
    }

    .letter-block {
      width: 64px;
      height: 64px;
      background: #FFFFFF;
      border: 3.5px solid #4D96FF;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #2B6CB0;
      cursor: grab;
      box-shadow: 0 5px 0 #2B6CB0;
      touch-action: none;
      user-select: none;
    }

    .letter-block:active, .letter-block.dragging {
      cursor: grabbing;
      transform: scale(1.15);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0.95;
    }

    /* 공통 음성 다시듣기 버튼 */
    .tts-btn {
      background: #FFD166;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      color: #5D4037;
      cursor: pointer;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0 #E5B339;
    }

    .tts-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #E5B339;
    }

    /* 하단 별점 */
    .score-container {
      margin-top: 10px;
      font-size: 1.3rem;
      color: #FFB703;
    }

    /* 축하 화면 오버레이 */
    .celebration-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration-emoji {
      font-size: 5.2rem;
      animation: heartBeat 0.7s infinite alternate;
    }

    @keyframes heartBeat {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    .celebration-text {
      font-size: 2.2rem;
      color: #FF4D6D;
      margin-top: 12px;
    }

    .shake-anim {
      animation: shakeFail 0.4s ease;
    }

    @keyframes shakeFail {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 헤더 -->
    <div class="header">
      <h1 class="title">✨ 윤슬의 한글게임 ✨</h1>
      <div class="sub-title" id="subTitleText">우리가족 이름을 맞춰봐요!</div>
    </div>

    <!-- 🎮 두 게임 간 전환 탭 버튼 -->
    <div class="main-game-nav">
      <button class="nav-btn active" id="btn-main-game1" onclick="switchMainGame('click')">
        👉 콕콕 누르기 게임
      </button>
      <button class="nav-btn" id="btn-main-game2" onclick="switchMainGame('puzzle')">
        🧩 글자 모아 완성하기
      </button>
    </div>

    <!-- ======================= 1. 콕콕 누르기 게임 뷰 ======================= -->
    <div id="view-game1">
      <div class="game1-submodes">
        <button class="submode-btn active" id="subtab-1" onclick="setGame1Mode('familyToName')">호칭 ➔ 이름</button>
        <button class="submode-btn" id="subtab-2" onclick="setGame1Mode('nameToFamily')">이름 ➔ 호칭</button>
        <button class="submode-btn" id="subtab-3" onclick="setGame1Mode('wordMatch')">같은 글자 짝꿍</button>
      </div>

      <div class="quiz-card">
        <div class="avatar-icon" id="g1-icon">👩</div>
        <div class="prompt-label" id="g1-prompt">엄마의 이름은 무엇일까요?</div>
        <div class="target-word" id="g1-word">엄마</div>
        <br>
        <button class="tts-btn" onclick="speakCurrent()">🔊 목소리로 듣기</button>
      </div>

      <div class="options-grid" id="g1-options">
        <!-- 버튼 동적 생성 -->
      </div>
    </div>

    <!-- ======================= 2. 섞인 글자 순서대로 끌어오기 게임 뷰 ======================= -->
    <div id="view-game2" style="display: none;">
      <div class="game2-card">
        <div class="avatar-icon" id="g2-icon">👩</div>
        <div class="prompt-label" id="g2-prompt">엄마 이름을 순서대로 끌어와서 맞춰보세요!</div>
        <div class="target-word" id="g2-target-name">엄마</div>

        <!-- 완성 글자 슬롯 영역 (예: [남] [ ] [ ]) -->
        <div class="slots-container" id="g2-slots">
          <!-- 동적 생성 -->
        </div>

        <button class="tts-btn" onclick="speakCurrent()">🔊 목소리로 듣기</button>
      </div>

      <!-- 섞여 있는 글자 바구니 -->
      <div style="font-size: 1.05rem; color: #718096; margin-bottom: 4px;">👇 글자를 꾹 끌어서 위 상자에 쏙! 넣어보세요 (클릭도 가능해요)</div>
      <div class="letters-basket" id="g2-basket">
        <!-- 동적 생성 (예: 남, 윤, 정, 호, 슬, 태 등) -->
      </div>
    </div>

    <!-- 점수 / 별 모으기 -->
    <div class="score-container" id="starDisplay">
      ⭐ 별 모으기: 0개
    </div>

    <!-- 축하 애니메이션 오버레이 -->
    <div class="celebration-overlay" id="celebrationOverlay">
      <div class="celebration-emoji" id="celebrationEmoji">🎉</div>
      <div class="celebration-text" id="celebrationText">참 잘했어요!</div>
    </div>
  </div>

  <script>
    // 가족 데이터 (윤슬이는 호칭: '나', 5살 남아 🧒)
    // 순서: 엄마 -> 형아 -> 아빠 -> 나 (윤슬)
    const familyData = [
      { role: '엄마', name: '남호정', icon: '👩' },
      { role: '형아', name: '윤호',   icon: '👦' },
      { role: '아빠', name: '윤태환', icon: '👨' },
      { role: '나',   name: '윤슬',   icon: '🧒' }
    ];

    // 가족 글자 풀 (남, 호, 정, 윤, 태, 환, 슬)
    const allFamilyChars = ['남', '호', '정', '윤', '태', '환', '슬'];

    let currentMainGame = 'click'; // 'click' | 'puzzle'
    let game1Mode = 'familyToName'; // 'familyToName' | 'nameToFamily' | 'wordMatch'
    let starsCount = 0;
    let isProcessing = false;
    let currentVoiceText = '';

    // 글자모아 완성하기 순환 인덱스
    let puzzleTurnIndex = 0;

    // 게임 2(퍼즐) 상태 변수
    let puzzleTarget = null; // { role, name, icon }
    let puzzleFilledCount = 0; // 몇 번째 글자까지 채웠는지

    // 사운드 및 브라우저 AudioContext 안전 초기화
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 사용자 요청: 기계음/실로폰 효과음은 완전히 끄고, 오직 한글 목소리(TTS)로만 읽어줌!
    function playSound(type) {
      // 효과음 없음
    }

    // Windows/Chrome 침묵 버그 방지: 전역 변수로 utterance 참조를 유지해야 가비지 컬렉션(GC)에 의해 소리가 끊기지 않습니다.
    let globalUtterance = null;
    let speakTimer = null;

    // 한국어 음성 탐색
    function getKoreanVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'ko-KR' || v.lang === 'ko_KR' || v.lang.startsWith('ko')) || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        getKoreanVoice();
      };
    }

    // 아이 목소리 톤으로 또박또박 한글 읽어주기
    function speakChildVoice(text, onEnd) {
      if (!('speechSynthesis' in window)) return;
      
      clearTimeout(speakTimer);

      try {
        // 크롬 음성 엔진 멈춤 상태 해제
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel(); // 이전 큐 비우기
      } catch (e) {
        console.warn(e);
      }

      // Windows Chrome에서는 cancel() 직후 바로 speak()를 부르면 무음이 되는 버그가 있어 50ms 후 재생
      speakTimer = setTimeout(() => {
        try {
          const targetVoice = getKoreanVoice();
          globalUtterance = new SpeechSynthesisUtterance(String(text));
          globalUtterance.lang = 'ko-KR';
          if (targetVoice) {
            globalUtterance.voice = targetVoice;
          }
          globalUtterance.pitch = 1.35; // 아이 목소리 톤
          globalUtterance.rate = 0.95;   // 또박또박 속도
          globalUtterance.volume = 1.0;

          globalUtterance.onend = () => {
            if (onEnd) onEnd();
          };

          globalUtterance.onerror = (err) => {
            console.warn('Speech error:', err);
          };

          window.speechSynthesis.speak(globalUtterance);
        } catch (err) {
          console.warn('TTS speak failed:', err);
        }
      }, 50);
    }

    function speakText(text, onEnd) {
      speakChildVoice(text, onEnd);
    }

    function speakCurrent() {
      if (currentVoiceText) speakText(currentVoiceText);
    }

    /* =================== 대메뉴 전환 =================== */
    function switchMainGame(gameType) {
      currentMainGame = gameType;
      document.getElementById('btn-main-game1').classList.toggle('active', gameType === 'click');
      document.getElementById('btn-main-game2').classList.toggle('active', gameType === 'puzzle');

      const v1 = document.getElementById('view-game1');
      const v2 = document.getElementById('view-game2');
      const subTitle = document.getElementById('subTitleText');

      if (gameType === 'click') {
        v1.style.display = 'block';
        v2.style.display = 'none';
        subTitle.innerText = '우리가족 이름을 버튼으로 콕콕 맞춰봐요!';
        nextRoundGame1();
      } else {
        v1.style.display = 'none';
        v2.style.display = 'block';
        subTitle.innerText = '섞여있는 글자를 순서대로 끌어와서 이름을 완성해요!';
        nextRoundGame2();
      }
    }

    /* =================== 게임 1: 콕콕 누르기 로직 =================== */
    function setGame1Mode(mode) {
      game1Mode = mode;
      document.getElementById('subtab-1').classList.toggle('active', mode === 'familyToName');
      document.getElementById('subtab-2').classList.toggle('active', mode === 'nameToFamily');
      document.getElementById('subtab-3').classList.toggle('active', mode === 'wordMatch');
      nextRoundGame1();
    }

    let g1Target = null;
    let g1Answer = '';

    function nextRoundGame1() {
      isProcessing = false;
      document.getElementById('celebrationOverlay').style.display = 'none';

      g1Target = familyData[Math.floor(Math.random() * familyData.length)];
      const iconEl = document.getElementById('g1-icon');
      const promptEl = document.getElementById('g1-prompt');
      const wordEl = document.getElementById('g1-word');
      const optContainer = document.getElementById('g1-options');
      optContainer.innerHTML = '';

      iconEl.innerText = g1Target.icon;

      if (game1Mode === 'familyToName') {
        promptEl.innerText = `${g1Target.role}의 이름은 무엇일까요?`;
        wordEl.innerText = g1Target.role;
        g1Answer = g1Target.name;
        currentVoiceText = `${g1Target.role}! ${g1Target.role}의 이름은 무엇일까요?`;
      } else if (game1Mode === 'nameToFamily') {
        promptEl.innerText = `${g1Target.name}은(는) 누구일까요?`;
        wordEl.innerText = g1Target.name;
        g1Answer = g1Target.role;
        currentVoiceText = `${g1Target.name}! 누구일까요?`;
      } else {
        promptEl.innerText = `똑같은 글자를 찾아보세요!`;
        wordEl.innerText = g1Target.name;
        g1Answer = g1Target.name;
        currentVoiceText = `${g1Target.name}! 똑같은 글자를 찾아보세요!`;
      }

      let pool = (game1Mode === 'nameToFamily') ? familyData.map(d => d.role) : familyData.map(d => d.name);
      let choices = pool.filter(c => c !== g1Answer);
      shuffleArray(choices);
      let finalOptions = [g1Answer, choices[0], choices[1]];
      if (choices[2]) finalOptions.push(choices[2]);
      shuffleArray(finalOptions);

      finalOptions.forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = text;
        btn.onclick = () => handleGame1Choice(text, btn);
        optContainer.appendChild(btn);
      });

      speakCurrent();
    }

    function handleGame1Choice(selectedText, btnEl) {
      if (isProcessing) return;
      if (selectedText === g1Answer) {
        isProcessing = true;
        // 효과음 + 글자 읽어주기 동시 재생
        playSound('correct');
        speakText(selectedText);

        starsCount++;
        updateStars();
        btnEl.style.background = '#C6F6D5';

        setTimeout(() => {
          celebrateSuccess(selectedText, () => nextRoundGame1());
        }, 1000);
      } else {
        playSound('wrong');
        btnEl.style.background = '#FED7D7';
        // 고른 한글 읽어준 뒤 다시 찾아보게 안내
        speakText(`${selectedText}! 다시 한번 찾아볼까요?`);
        setTimeout(() => {
          btnEl.style.background = '#FFFFFF';
        }, 600);
      }
    }

    /* =================== 게임 2: 섞인 글자 모아 완성하기 로직 =================== */
    function nextRoundGame2() {
      isProcessing = false;
      document.getElementById('celebrationOverlay').style.display = 'none';

      // 엄마 -> 형아 -> 아빠 -> 나 순환
      puzzleTarget = familyData[puzzleTurnIndex % familyData.length];
      puzzleTurnIndex++;
      puzzleFilledCount = 0;

      document.getElementById('g2-icon').innerText = puzzleTarget.icon;
      
      const roleText = (puzzleTarget.role === '나') ? '내' : `${puzzleTarget.role}`;
      document.getElementById('g2-prompt').innerText = `${roleText} 이름을 순서대로 맞춰보세요!`;
      // 화면에 이름 예시를 보여주지 않고 호칭만 표시하여 스스로 맞추도록 함
      document.getElementById('g2-target-name').innerText = (puzzleTarget.role === '나') ? '나 (윤슬)' : puzzleTarget.role;

      // 음성에서도 이름 정답을 직접 말해주지 않고 스스로 찾도록 안내
      currentVoiceText = `${roleText} 이름을 순서대로 맞춰보세요!`;

      // 슬롯 생성 (예: 남 호 정 -> 3개 슬롯)
      const slotsContainer = document.getElementById('g2-slots');
      slotsContainer.innerHTML = '';
      for (let i = 0; i < puzzleTarget.name.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot-box';
        slot.id = `slot-${i}`;
        slot.innerText = (i === 0) ? '?' : '';
        slotsContainer.appendChild(slot);
      }

      // 섞인 글자 바구니 생성
      const basket = document.getElementById('g2-basket');
      basket.innerHTML = '';

      // 정답 글자들 + 다른 가족의 섞인 글자들로 6~7개 구성
      let targetChars = puzzleTarget.name.split('');
      let extraChars = allFamilyChars.filter(c => !targetChars.includes(c));
      shuffleArray(extraChars);

      let basketChars = [...targetChars, ...extraChars.slice(0, 3)];
      shuffleArray(basketChars);

      basketChars.forEach((ch, idx) => {
        const block = createLetterDragBlock(ch, `letter-${idx}`);
        basket.appendChild(block);
      });

      speakCurrent();
    }

    function createLetterDragBlock(charText, id) {
      const block = document.createElement('div');
      block.className = 'letter-block';
      block.id = id;
      block.innerText = charText;
      block.dataset.char = charText;

      let isDragging = false;
      let startX = 0, startY = 0;
      let hasMoved = false;

      // PointerDown
      block.onpointerdown = (e) => {
        if (isProcessing) return;
        isDragging = true;
        hasMoved = false;
        block.setPointerCapture(e.pointerId);

        startX = e.clientX;
        startY = e.clientY;

        block.classList.add('dragging');
        block.style.position = 'relative';
        block.style.zIndex = 1000;
        speakText(charText);
      };

      // PointerMove
      block.onpointermove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          hasMoved = true;
        }
        block.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;

        // 현재 채워야 할 타겟 슬롯 체크
        const currentSlot = document.getElementById(`slot-${puzzleFilledCount}`);
        if (currentSlot) {
          const rect = currentSlot.getBoundingClientRect();
          if (
            e.clientX >= rect.left && e.clientX <= rect.right &&
            e.clientY >= rect.top && e.clientY <= rect.bottom
          ) {
            currentSlot.classList.add('drag-over');
          } else {
            currentSlot.classList.remove('drag-over');
          }
        }
      };

      // PointerUp
      block.onpointerup = (e) => {
        if (!isDragging) return;
        isDragging = false;
        block.releasePointerCapture(e.pointerId);
        block.classList.remove('dragging');

        const currentSlot = document.getElementById(`slot-${puzzleFilledCount}`);
        let droppedOnTarget = false;

        if (currentSlot) {
          currentSlot.classList.remove('drag-over');
          const rect = currentSlot.getBoundingClientRect();
          droppedOnTarget = (
            e.clientX >= rect.left - 25 && e.clientX <= rect.right + 25 &&
            e.clientY >= rect.top - 25 && e.clientY <= rect.bottom + 25
          );
        }

        // 아이가 드래그를 어려워할 수 있으므로, 그냥 '클릭'만 해도 슬롯에 맞출 수 있도록 배려
        if (droppedOnTarget || !hasMoved) {
          attemptFillSlot(charText, block);
        } else {
          // 제자리로 복귀
          resetBlockPos(block);
        }
      };

      block.onpointercancel = () => {
        isDragging = false;
        block.classList.remove('dragging');
        resetBlockPos(block);
      };

      return block;
    }

    function resetBlockPos(block) {
      block.style.transition = 'transform 0.2s ease';
      block.style.transform = 'translate(0px, 0px)';
      setTimeout(() => {
        block.style.transition = '';
        block.style.position = '';
        block.style.zIndex = '';
      }, 200);
    }

    function attemptFillSlot(charText, blockEl) {
      const neededChar = puzzleTarget.name[puzzleFilledCount];

      if (charText === neededChar) {
        // 일치! 실로폰 통통 소리와 함께 한글 글자 음성 읽어주기
        playSound('pop');
        speakText(charText);

        const slot = document.getElementById(`slot-${puzzleFilledCount}`);
        slot.innerText = charText;
        slot.classList.add('filled');
        blockEl.style.visibility = 'hidden';

        puzzleFilledCount++;

        // 아직 채울 글자가 남았을 때
        if (puzzleFilledCount < puzzleTarget.name.length) {
          const nextSlot = document.getElementById(`slot-${puzzleFilledCount}`);
          if (nextSlot) nextSlot.innerText = '?';
        } else {
          // 전체 이름 완성!
          isProcessing = true;
          // 이름 완성 축하 실로폰 소리!
          playSound('correct');
          starsCount++;
          updateStars();

          // 1초 뒤 칭찬 화면 등장
          setTimeout(() => {
            celebrateSuccess(puzzleTarget.name, () => nextRoundGame2());
          }, 1000);
        }
      } else {
        // 틀렸을 때 통! 소리와 함께 고른 글자 발음
        playSound('wrong');
        resetBlockPos(blockEl);

        const currentSlot = document.getElementById(`slot-${puzzleFilledCount}`);
        if (currentSlot) currentSlot.classList.add('shake-anim');
        setTimeout(() => {
          if (currentSlot) currentSlot.classList.remove('shake-anim');
        }, 400);

        speakText(`${charText}! 다른 글자를 찾아볼까요?`);
      }
    }

    /* =================== 공통 칭찬 피드백 =================== */
    function celebrateSuccess(word, callback) {
      // 칭찬 화면 뜰 때도 신나는 축하 멜로디 울림!
      playSound('correct');

      const praises = [
        '참 잘했어요!',
        '우리 윤슬이 최고!',
        '멋쟁이 윤슬이!',
        '아주 잘했어요!'
      ];
      const celebrationVoice = praises[Math.floor(Math.random() * praises.length)];
      const emojis = ['🌟', '💖', '🎉', '👏', '🥳', '🎈'];
      const chosenEmoji = emojis[Math.floor(Math.random() * emojis.length)];

      // 화면에 표시되는 글자
      const displayedText = `${word}! ${celebrationVoice}`;
      document.getElementById('celebrationEmoji').innerText = chosenEmoji;
      document.getElementById('celebrationText').innerText = displayedText;
      document.getElementById('celebrationOverlay').style.display = 'flex';

      // 칭찬 화면 글자를 아이 목소리로 읽어주기!
      speakText(displayedText);

      setTimeout(() => {
        callback();
      }, 2300);
    }

    function updateStars() {
      let starStr = `⭐ 별 모으기: ${starsCount}개 (`;
      const displayStars = Math.min(starsCount, 8);
      for (let i = 0; i < displayStars; i++) starStr += '⭐';
      starStr += ')';
      document.getElementById('starDisplay').innerText = starStr;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    window.addEventListener('load', () => {
      switchMainGame('click');
    });
  </script>
</body>
